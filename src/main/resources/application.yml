server:
  port: 8080

spring:
  application:
    name: langchain4j-demo
  data:
    redis:
      host: localhost
      port: 6379
      timeout: PT2S
      lettuce:
        shutdown-timeout: PT0S

# 不要在 langchain4j.* 下加任何 chat-model / streaming-chat-model / embedding-model 配置块，
# 否则 LangChain4j starter 会和 LlmConfig 各创建一份 Bean → 启动冲突。
# 全部 LLM/Embedding 配置都走 app.llm.* 由 LlmConfig 统一装配。

app:
  security:
    # API key 鉴权 + 多租户隔离。关掉本地 demo 仍可裸跑（TenantContext 走 ANONYMOUS 兜底）
    enabled: true
    # api-key -> { tenant, user, scopes }。生产应换成 DB / Redis；这里 dev seed 两个 key 演示
    # 调用示例：curl -H "X-Api-Key: dev-key-tenantA-admin" -X POST localhost:8080/chat ...
    api-keys:
      dev-key-tenantA-admin:
        tenant: tenantA
        user: alice
        # scopes 会变成 SimpleGrantedAuthority("SCOPE_xxx")，配合 @PreAuthorize("hasAuthority('SCOPE_xxx')")
        scopes: [chat, ingest, eval]
      dev-key-tenantB-readonly:
        tenant: tenantB
        user: bob
        scopes: [chat]

  rate-limit:
    # token bucket 限流，per-(tenantId, endpoint family)，每分钟刷桶。429 + Retry-After
    enabled: true
    # 单位：每分钟最大请求数。endpoint family 在 RateLimitFilter.familyOf() 里按 URL 路径映射
    defaults:
      chat: 60         # /chat /chat/category /chat/multi-agent /chat/reflexive /chat/auto /chat/mcp /extract/*
      stream: 20       # /chat/stream /chat/reflexive/stream /chat/multi-agent/stream —— SSE 占连接，限更紧
      ingest: 5        # /rag/ingest —— 写操作 + 重，必须限紧
      eval: 5          # /eval/run /eval/run-cases
      default: 120     # 其余未明确归类的 endpoint
    # 未鉴权租户（ANONYMOUS）的配额倍率。0.2 表示 anonymous 只享受 default 配额的 20%
    anonymous-multiplier: 0.2
    # 大客户单独提配额示例
    overrides: {}
    #   tenantA:
    #     chat: 600
    #     stream: 100

  async:
    # 异步任务 store 的 TTL —— 终态 task 保留多久（超时被 @Scheduled cleanup 清掉）
    task-ttl: PT24H
    webhook:
      # task 完成时给客户端回调。客户端在 /chat/multi-agent/async body 里传 webhookUrl 才生效
      enabled: true
      # HMAC-SHA256 签名 secret，放 X-Webhook-Signature header。生产从环境变量 / K8s Secret 取
      hmac-secret: ${WEBHOOK_HMAC_SECRET:dev-secret-change-me}
      # 单次请求超时（包括 connect + read）
      timeout: PT5S
      # 失败重试次数（不计首次）。退避公式：backoff * 3^(attempt-1)。默认 1s/3s/9s 共 3 次
      max-retries: 3
      backoff: PT1S

  guardrail:
    injection:
      # Prompt-injection 检测 —— LangChain4j InputGuardrail 挂在主 Assistant.chat / chatStream
      # 检测顺序：规则匹配（免费、即时）→ 可选 LLM 分类器（精准但每条 query 多 1 次 LLM call）
      enabled: true
      # block（默认）— fatal 终止调用，调用方拿错误
      # sanitize — user message 替换为 [QUERY REDACTED]，模型仍执行
      # audit — 只 warn 日志放行，生产灰度初期用来观察误伤率
      action: block
      llm:
        # 默认关 —— 规则覆盖 95% 已知 jailbreak，启用 LLM 才接 1-shot 模糊攻击。token 成本敏感时不要开
        enabled: false
        # LLM 返回 confidence ≥ 此值才判定 injection。0.7 是经验起点；0.5 容易误伤、0.9 容易漏过
        confidence-threshold: 0.7

  token-budget:
    # 日 token 预算 —— 跟 rate-limit 是两个维度：限流挡突发，token-budget 控成本
    # 覆盖 chat / stream / eval family（会触发 LLM 调用）；ingest 走 embedding 暂不计入
    enabled: true
    # 日历日重置以哪个时区为准。建议显式配，避免随 server timezone 漂
    timezone: Asia/Shanghai
    daily-tokens:
      default: 100000   # 默认每天 10 万 token / tenant —— 大概 ~50 次 multi-agent 调用
      overrides: {}
      #   tenantA: 500000
    # anonymous 兜底租户的预算倍率。0.05 表示 anonymous 只享受 default 的 5%
    anonymous-multiplier: 0.05

  llm:
    # ollama | openai | anthropic | gemini | deepseek | vllm
    # 切 provider 只影响 chat/streaming-chat；embedding 由 app.embedding.provider 独立控制。
    provider: ollama
    ollama:
      base-url: http://localhost:11434
      model-name: llama3.1
      temperature: 0.7
      timeout: PT60S
      log-requests: true
      log-responses: true
    openai:
      # 默认走 OpenAI 官方端点，留空即可；如果走代理/兼容端点，填 base-url
      base-url:
      api-key: ${OPENAI_API_KEY:}
      model-name: gpt-4o-mini
      temperature: 0.7
      timeout: PT60S
      log-requests: false
      log-responses: false
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      # 常见可选：claude-haiku-4-5 / claude-sonnet-4-6 / claude-opus-4-7
      model-name: claude-haiku-4-5
      temperature: 0.7
      timeout: PT60S
      log-requests: false
      log-responses: false
    gemini:
      api-key: ${GOOGLE_AI_GEMINI_API_KEY:}
      # 常见可选：gemini-2.0-flash / gemini-1.5-flash / gemini-1.5-pro
      model-name: gemini-2.0-flash
      temperature: 0.7
      timeout: PT60S
      log-requests: false
      log-responses: false
    deepseek:
      # DeepSeek 走 OpenAI-compatible 协议
      base-url: https://api.deepseek.com/v1
      # 安全提醒：之前这里有过 hardcode 的 key（sk-8add...），已轮换 + 改为空 fallback
      # 部署时务必走环境变量 / K8s Secret / Vault，绝不要把真 key 写回 yml
      api-key: ${DEEPSEEK_API_KEY:}
      # deepseek-chat（V3）/ deepseek-reasoner（R1）
      model-name: deepseek-chat
      temperature: 0.7
      timeout: PT60S
      log-requests: false
      log-responses: false
    vllm:
      # vLLM 走 OpenAI-compatible 协议；生产推荐（PagedAttention + continuous batching）
      # K8s 部署：填 service DNS（http://<svc>.<ns>.svc.cluster.local:8000/v1）
      # 本地起 vLLM 调试可改成 http://localhost:8000/v1
      base-url: http://vllm-chat.default.svc.cluster.local:8000/v1
      # vLLM 默认不校验 api-key，留 EMPTY 占位即可（require() 不接受空串）
      api-key: ${VLLM_API_KEY:EMPTY}
      # 必填：vLLM 启动时 --model 传的那个，比如 meta-llama/Llama-3.1-8B-Instruct / Qwen/Qwen2.5-7B-Instruct
      model-name: ${VLLM_MODEL:}
      temperature: 0.7
      timeout: PT120S
      log-requests: false
      log-responses: false

  embedding:
    # ollama（默认，本地开发）| openai-compat（生产推荐，走 vLLM/TEI/云 API）
    # 切 provider = 换向量维度 = 必须 drop 重建持久化向量库（InMemoryEmbeddingStore 无所谓）
    provider: ollama
    ollama:
      base-url: http://localhost:11434
      model-name: nomic-embed-text     # 768 维
      timeout: PT60S
    openai-compat:
      # 生产示例：vLLM 单独跑 embedding 模型（vllm serve BAAI/bge-m3 --task embed）
      # 或者 TEI（Text Embeddings Inference）/ 云端 OpenAI
      base-url: http://vllm-embed.default.svc.cluster.local:8000/v1
      api-key: ${VLLM_EMBED_API_KEY:EMPTY}
      model-name: BAAI/bge-m3          # 1024 维，多语言
      timeout: PT60S
      log-requests: false
      log-responses: false

  assistant:
    # 主 Assistant 的 system prompt 可调参数；模板在 ai/Assistant.java 的 @SystemMessage 里。
    # 改这里不用动 Java，重启即生效。改完用 /eval/run 看 passRate 漂移。
    language: "中文"
    tone: "简洁，1–2 句话答完，必要时再展开"
    # 互斥的 3 种情况；之前一份"没检索到就说『资料里没有提到』"无差别套用，
    # 被 eval 钉出来回归（即便用户直接给信息也被加这种免责前言），所以严格分 case。
    citation-policy: |-
      引用与来源处理（按以下情况分别处理，互斥）：
        1) 如果系统检索到了文档片段并用于回答，必须用 [doc=文件名#片段号] 形式标注来源。
        2) 如果用户的问题明确指向文档/知识库（含『文档』『手册』『文献』『资料里』『根据上述材料』等线索），
           但没有检索到相关内容，回复『未在文档中找到相关内容』。
        3) 其他情况（用户在本轮提供了信息、闲聊、工具调用、定义性问题等），
           直接根据用户问题与已有上下文作答 —— 不要加『资料里没有提到 X』之类的免责前言，也不要声明检索状态。
    # 灰度/临时指令位。默认空字符串。例如做 A/B 时填 "本轮请用 markdown 列表组织答案"
    extra: ""
    # 按 provider 部分覆盖。key 是 app.llm.provider 的值；任何字段为 null/缺失就 fallback 到上面的默认。
    # 启动时根据 app.llm.provider 解析成 ResolvedAssistantStyle Bean，运行时不变。
    # 例（全部注释起来，默认所有 provider 共享上面的默认值；按需打开）：
    overrides: {}
    #   anthropic:
    #     tone: "简洁，1–2 句；分组事实时用 <fact>...</fact> XML 标签，Claude 对结构化标签更敏感"
    #   gemini:
    #     # Gemini 触发工具不积极，专门给一句诱导
    #     extra: "如果有可用工具能直接给答案，立刻调用；不要先猜再决定"
    #   ollama:
    #     # Ollama 小模型，要求更明确的指令
    #     tone: "简洁，每句独立成段，避免长复合句；最多 3 句"
    #   deepseek:
    #     # DeepSeek 中文强，可以让风格更口语
    #     tone: "口语化，像跟同事讲技术，必要时用类比；2–3 句话"

  memory:
    # in-memory | redis
    store: in-memory
    # messages | tokens | summary
    # - messages: 按消息数滑窗
    # - tokens: 按 token 数滑窗（OpenAi tokenizer 近似计数）
    # - summary: 超过 max-messages 时把旧消息 LLM 摘要成单条 SystemMessage
    window-mode: messages
    max-messages: 20
    max-tokens: 2000
    tokenizer-model: gpt-4o-mini
    summary:
      # summary 模式下保留多少条最近消息不被压缩
      keep-recent: 6
    redis:
      key-prefix: "chat:mem:"
      ttl: PT24H
  eval:
    # /eval/run 第一次被调时是否自动跑一次 /rag/ingest（之后不再重复）。
    # 默认关 —— 不想被 eval 误改向量库。开了能避免「RAG case 召回空 → 假 fail」浪费排查。
    auto-ingest: false

  query-router:
    # 开了之后 /chat/auto 走 classify → 分流到 Assistant(走RAG) 或 BareAssistant(跳过RAG)。
    # 默认关 —— classifier 多 1 次 LLM call，要明确权衡 token 成本才开。
    # 适合：embedding 走云 API（按 token 计费）+ 主对话用大模型 + 大量非 RAG 流量 的生产场景。
    enabled: false

  reflexion:
    # 加权聚合分 < threshold 触发改进；最多 max-attempts 次额外改进（首次生成不计）
    threshold: 0.75
    max-attempts: 2
    # Critic 3 维加权权重。不需要归一化，会用总和当分母。
    # 默认偏重 correctness + completeness（不出错+答全），clarity 次之。
    weights:
      correctness: 0.4
      completeness: 0.4
      clarity: 0.2

  multi-agent:
    replan:
      # Plan-and-Execute 闭环：Synthesizer 出最终答案后跑 Critic 评分，
      # 加权聚合 < threshold → 让 Replanner 看着上一轮 plan/answer/mainIssue 出新 plan，
      # 重跑 DAG。默认关 —— 开启会额外多 1 次 Critic + 可能 1 次 Replanner + 一整轮 worker fan-out。
      enabled: false
      threshold: 0.75
      # 上限 = 多少次"额外"重规划（首次执行不计入）。常见值 1；2 已经接近极限，更多说明 plan 写崩
      max-replans: 1
      # 跟 reflexion 同款 3 维加权，独立配置便于未来分别调整
      weights:
        correctness: 0.4
        completeness: 0.4
        clarity: 0.2
  mcp:
    enabled: false
    # stdio | http
    transport: stdio
    stdio:
      # 例如：npx -y @modelcontextprotocol/server-filesystem /path/to/dir
      command:
        - npx
        - "-y"
        - "@modelcontextprotocol/server-everything"
    http:
      url: http://localhost:3001/mcp
    log-events: true
  rag:
    documents-dir: ./documents
    # 召回截断（rerank 关闭时直接作为返回数；rerank 开启时由 reranker 作为最终 top-k）
    top-k: 5
    chunking:
      # recursive（默认）— 按字符数硬切 + overlap，简单粗暴，适合任何文档
      # markdown-header — 按 ## section 切，每个 chunk 是完整主题；超长 section fallback 到 recursive
      strategy: recursive
      max-chars: 300       # recursive 的目标 chunk 大小；markdown-header 的 section 长度阈值
      overlap: 50          # recursive 模式 chunk 重叠字符数（markdown-header 模式只在 fallback 时用到）

    grounding:
      # RAG 事实幻觉的事后校验（仅作用于触发了检索的回答）。两层叠加：
      #   Layer 0（零 LLM）— 答案里 [doc=ID] 引用的 id 必须在检索集合里，否则判编造引用
      #   Layer 1（faithfulness）— source + 答案喂 temp=0 GroundednessChecker，聚合分 < threshold 视为可能未被支撑
      # 命中任一层就在答案末尾追加"⚠️ 可信度提示"（warn 模式，不改写不拒答）。
      # 代价：开启后每条走 RAG 的回答多 1 次 temp=0 LLM 调用。
      enabled: false
      threshold: 0.7

    history-aware:
      # 多轮对话场景：CompressingQueryTransformer 把"它跟 X 啥区别"+ history → "Y 跟 X 啥区别"
      # 再检索。不开则代词类 follow-up 召回会很差。代价是每条 query 多 1 次 LLM call。
      # 跟 query-expansion 互补，两个都开会自动 chain（compress→expand 顺序）。
      enabled: false

    query-expansion:
      # 开了之后每条 query 多 1 次 LLM call 把它扩成 n 个变体（同义改写 / 加上下文 / 拆子问题），
      # 多路并行召回 → DefaultContentAggregator RRF 融合。提升召回，代价是 LLM 成本 + 延迟。
      # 跟 rerank 互补：expansion 提召回，rerank 提精度，两个都开效果叠加。
      enabled: false
      n: 3

    rerank:
      # 关闭则普通向量检索；开启则在 EmbeddingStore 召回 candidate-size 条后再排
      enabled: false
      candidate-size: 20
      # llm（本地 Ollama 当 reranker，慢但零依赖）| jina（云 API，快+多语言，需 api-key）
      type: llm
      jina:
        api-key: ${JINA_API_KEY:}
        model-name: jina-reranker-v2-base-multilingual
    hybrid:
      # 开启后 vector + 关键词 token-overlap 两路并联检索，DefaultContentAggregator RRF 融合
      enabled: false
      # simple（按字 + 标点切，零依赖）| hanlp（自带词典，中文召回明显更好）
      tokenizer: simple
    # in-memory | pgvector | milvus | chroma | qdrant | doris
    store: in-memory
    pgvector:
      host: localhost
      port: 5432
      database: postgres
      user: postgres
      password: postgres
      table: document_embeddings
      create-table: true
      use-index: true
      index-list-size: 100
      # VECTOR (默认) | HYBRID — HYBRID 走 PGVector 原生向量+全文 RRF 融合
      search-mode: VECTOR
      text-search-config: simple
      rrf-k: 60
    milvus:
      host: localhost
      port: 19530
      collection: document_embeddings
      # FLAT | IVF_FLAT | HNSW | ...
      index-type: FLAT
      # COSINE | L2 | IP
      metric-type: COSINE
      username:
      password:
    chroma:
      base-url: http://localhost:8000
      collection: document_embeddings
      # 留空则用 chroma v1 API；v2 (chroma >= 0.7) 需要填 tenant / database
      tenant:
      database:
    qdrant:
      host: localhost
      port: 6334
      collection: document_embeddings
      api-key:
      use-tls: false
    doris:
      jdbc-url: jdbc:mysql://localhost:9030/demo
      user: root
      password:
      table: document_embeddings
      # cosine | l2
      metric: cosine
      create-table: true
      buckets: 4

management:
  endpoints:
    web:
      exposure:
        # tokenbudget：自定义 endpoint，per-tenant 当日 token 用量快照（运维 dashboard 用）
        include: health,info,metrics,prometheus,tokenbudget
  endpoint:
    health:
      # always 让 K8s probe / 运维直接看到每个 component 详情；actuator 端口通常只对内网开放
      show-details: always
      show-components: always
      # 把 llm / embedding 加进 readiness group，让 K8s readinessProbe 能感知 LLM 后端可达性
      group:
        readiness:
          include: readinessState,llm,embedding
  health:
    # 启用 Spring Boot 的 LivenessState/ReadinessState 健康指标（K8s 部署模式默认开启，
    # 本地启动需要显式打开，不然上面 group.readiness.include 里的 readinessState 找不到）
    probes:
      enabled: true

logging:
  level:
    dev.langchain4j: INFO
    com.lrj: DEBUG
  pattern:
    # ApiKeyAuthFilter 会把 tenantId/userId 灌进 MDC；未挂租户（actuator 等放行路径）显示空
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId:-}] [%X{tenantId:-}/%X{userId:-}] %-5level %logger{36} - %msg%n"
