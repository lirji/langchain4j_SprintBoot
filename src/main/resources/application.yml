server:
  port: 8089

spring:
  application:
    name: langchain4j-demo
  data:
    redis:
      host: localhost
      port: 6379
      timeout: PT2S
      lettuce:
        shutdown-timeout: PT0S
  # NL2SQL 的 demo 库种子由 Nl2SqlConfig 手动跑（ResourceDatabasePopulator），
  # 关掉 Spring Boot 的 schema.sql/data.sql 自动初始化，避免它包住我们的 DataSource。
  sql:
    init:
      mode: never

# 不要在 langchain4j.* 下加任何 chat-model / streaming-chat-model / embedding-model 配置块，
# 否则 LangChain4j starter 会和 LlmConfig 各创建一份 Bean → 启动冲突。
# 全部 LLM/Embedding 配置都走 app.llm.* 由 LlmConfig 统一装配。

app:
  security:
    # API key 鉴权 + 多租户隔离。关掉本地 demo 仍可裸跑（TenantContext 走 ANONYMOUS 兜底）
    enabled: true
    # api-key -> { tenant, user, scopes }。生产应换成 DB / Redis；这里 dev seed 两个 key 演示
    # 调用示例：curl -H "X-Api-Key: dev-key-tenantA-admin" -X POST localhost:8080/chat ...
    api-keys:
      dev-key-tenantA-admin:
        tenant: tenantA
        user: alice
        # scopes 会变成 SimpleGrantedAuthority("SCOPE_xxx")，配合 @PreAuthorize("hasAuthority('SCOPE_xxx')")
        scopes: [chat, ingest, eval]
      dev-key-tenantB-readonly:
        tenant: tenantB
        user: bob
        scopes: [chat]
      # 审批人 key：可发起对话 + 审批工作流（SCOPE_approve 守 /workflow/tasks*）
      dev-key-tenantA-approver:
        tenant: tenantA
        user: carol
        scopes: [chat, approve]

  rate-limit:
    # token bucket 限流，per-(tenantId, endpoint family)，每分钟刷桶。429 + Retry-After
    enabled: true
    # 单位：每分钟最大请求数。endpoint family 在 RateLimitFilter.familyOf() 里按 URL 路径映射
    defaults:
      chat: 60         # /chat /chat/category /chat/multi-agent /chat/reflexive /chat/auto /chat/mcp /extract/*
      stream: 20       # /chat/stream /chat/reflexive/stream /chat/multi-agent/stream —— SSE 占连接，限更紧
      ingest: 5        # /rag/ingest —— 写操作 + 重，必须限紧
      eval: 5          # /eval/run /eval/run-cases
      default: 120     # 其余未明确归类的 endpoint
    # 未鉴权租户（ANONYMOUS）的配额倍率。0.2 表示 anonymous 只享受 default 配额的 20%
    anonymous-multiplier: 0.2
    # 大客户单独提配额示例
    overrides: {}
    #   tenantA:
    #     chat: 600
    #     stream: 100

  async:
    # 异步任务 store 的 TTL —— 终态 task 保留多久（超时被 @Scheduled cleanup 清掉）
    task-ttl: PT24H
    webhook:
      # task 完成时给客户端回调。客户端在 /chat/multi-agent/async body 里传 webhookUrl 才生效
      enabled: true
      # HMAC-SHA256 签名 secret，放 X-Webhook-Signature header。生产从环境变量 / K8s Secret 取
      hmac-secret: ${WEBHOOK_HMAC_SECRET:dev-secret-change-me}
      # 单次请求超时（包括 connect + read）
      timeout: PT5S
      # 失败重试次数（不计首次）。退避公式：backoff * 3^(attempt-1)。默认 1s/3s/9s 共 3 次
      max-retries: 3
      backoff: PT1S

  guardrail:
    injection:
      # Prompt-injection 检测 —— LangChain4j InputGuardrail 挂在主 Assistant.chat / chatStream
      # 检测顺序：规则匹配（免费、即时）→ 可选 LLM 分类器（精准但每条 query 多 1 次 LLM call）
      enabled: true
      # block（默认）— fatal 终止调用，调用方拿错误
      # sanitize — user message 替换为 [QUERY REDACTED]，模型仍执行
      # audit — 只 warn 日志放行，生产灰度初期用来观察误伤率
      action: block
      llm:
        # 默认关 —— 规则覆盖 95% 已知 jailbreak，启用 LLM 才接 1-shot 模糊攻击。token 成本敏感时不要开
        enabled: false
        # LLM 返回 confidence ≥ 此值才判定 injection。0.7 是经验起点；0.5 容易误伤、0.9 容易漏过
        confidence-threshold: 0.7

  token-budget:
    # 日 token 预算 —— 跟 rate-limit 是两个维度：限流挡突发，token-budget 控成本
    # 覆盖 chat / stream / eval family（会触发 LLM 调用）；ingest 走 embedding 暂不计入
    enabled: true
    # 日历日重置以哪个时区为准。建议显式配，避免随 server timezone 漂
    timezone: Asia/Shanghai
    daily-tokens:
      default: 100000   # 默认每天 10 万 token / tenant —— 大概 ~50 次 multi-agent 调用
      overrides: {}
      #   tenantA: 500000
    # anonymous 兜底租户的预算倍率。0.05 表示 anonymous 只享受 default 的 5%
    anonymous-multiplier: 0.05

  llm:
    # ollama | openai | anthropic | gemini | deepseek | vllm
    # 切 provider 只影响 chat/streaming-chat；embedding 由 app.embedding.provider 独立控制。
    provider: ollama
    # Model Cascade / 成本路由：便宜模型先答，低置信才升级强模型。默认关。POST /chat/cascade。
    # cascade 是 app.llm 的直接子键（provider 的兄弟），不要嵌进具体 provider。详见 docs/model-cascade.md。
    cascade:
      enabled: false
      cheap-model:               # 留空则用当前 provider 默认 model-name（ollama 例 qwen2.5:3b）
      strong-model:              # 留空同上（ollama 例 qwen2.5:14b）
      min-answer-chars: 8        # 便宜答案短于此 → 判低置信 → 升级
      self-rating: false         # 启发式外再让便宜模型 temp=0 自评一个 0-1 分
      confidence-threshold: 0.6  # 仅 self-rating=true：自评 < 此值 → 升级
    ollama:
      base-url: http://localhost:11434
      model-name: llama3.1
      temperature: 0.7
      timeout: PT60S
      log-requests: true
      log-responses: true
    openai:
      # 默认走 OpenAI 官方端点，留空即可；如果走代理/兼容端点，填 base-url
      base-url:
      api-key: ${OPENAI_API_KEY:}
      model-name: gpt-4o-mini
      temperature: 0.7
      timeout: PT60S
      log-requests: false
      log-responses: false
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      # 常见可选：claude-haiku-4-5 / claude-sonnet-4-6 / claude-opus-4-7
      model-name: claude-haiku-4-5
      temperature: 0.7
      timeout: PT60S
      log-requests: false
      log-responses: false
      # prompt caching（Anthropic 专属）：缓存长 system prompt 前缀 + 工具定义，
      # 后续同前缀请求的输入 token 按 cache-read 计费（约 1 折）。OpenAI 系是服务端
      # 自动缓存、无需开关。改 system prompt / 工具会让缓存失效、下次重新建缓存。
      cache-system-messages: true
      cache-tools: true
    gemini:
      api-key: ${GOOGLE_AI_GEMINI_API_KEY:}
      # 常见可选：gemini-2.0-flash / gemini-1.5-flash / gemini-1.5-pro
      model-name: gemini-2.0-flash
      temperature: 0.7
      timeout: PT60S
      log-requests: false
      log-responses: false
    deepseek:
      # DeepSeek 走 OpenAI-compatible 协议
      base-url: https://api.deepseek.com/v1
      # 安全提醒：之前这里有过 hardcode 的 key（sk-8add...），已轮换 + 改为空 fallback
      # 部署时务必走环境变量 / K8s Secret / Vault，绝不要把真 key 写回 yml
      api-key: ${DEEPSEEK_API_KEY:}
      # deepseek-chat（V3）/ deepseek-reasoner（R1）
      model-name: deepseek-chat
      temperature: 0.7
      timeout: PT60S
      log-requests: false
      log-responses: false
    vllm:
      # vLLM 走 OpenAI-compatible 协议；生产推荐（PagedAttention + continuous batching）
      # K8s 部署：填 service DNS（http://<svc>.<ns>.svc.cluster.local:8000/v1）
      # 本地起 vLLM 调试可改成 http://localhost:8000/v1
      base-url: http://vllm-chat.default.svc.cluster.local:8000/v1
      # vLLM 默认不校验 api-key，留 EMPTY 占位即可（require() 不接受空串）
      api-key: ${VLLM_API_KEY:EMPTY}
      # 必填：vLLM 启动时 --model 传的那个，比如 meta-llama/Llama-3.1-8B-Instruct / Qwen/Qwen2.5-7B-Instruct
      model-name: ${VLLM_MODEL:}
      temperature: 0.7
      timeout: PT120S
      log-requests: false
      log-responses: false

  embedding:
    # ollama（默认，本地开发）| openai-compat（生产推荐，走 vLLM/TEI/云 API）
    # 切 provider = 换向量维度 = 必须 drop 重建持久化向量库（InMemoryEmbeddingStore 无所谓）
    provider: ollama
    ollama:
      base-url: http://localhost:11434
      model-name: nomic-embed-text     # 768 维
      timeout: PT60S
    openai-compat:
      # 生产示例：vLLM 单独跑 embedding 模型（vllm serve BAAI/bge-m3 --task embed）
      # 或者 TEI（Text Embeddings Inference）/ 云端 OpenAI
      base-url: http://vllm-embed.default.svc.cluster.local:8000/v1
      api-key: ${VLLM_EMBED_API_KEY:EMPTY}
      model-name: BAAI/bge-m3          # 1024 维，多语言
      timeout: PT60S
      log-requests: false
      log-responses: false

  assistant:
    # 主 Assistant 的 system prompt 可调参数；模板在 ai/Assistant.java 的 @SystemMessage 里。
    # 改这里不用动 Java，重启即生效。改完用 /eval/run 看 passRate 漂移。
    language: "中文"
    tone: "简洁，1–2 句话答完，必要时再展开"
    # 互斥的 3 种情况；之前一份"没检索到就说『资料里没有提到』"无差别套用，
    # 被 eval 钉出来回归（即便用户直接给信息也被加这种免责前言），所以严格分 case。
    citation-policy: |-
      引用与来源处理（按以下情况分别处理，互斥）：
        1) 如果系统检索到了文档片段并用于回答，必须用 [doc=文件名#片段号] 形式标注来源。
        2) 如果用户的问题明确指向文档/知识库（含『文档』『手册』『文献』『资料里』『根据上述材料』等线索），
           但没有检索到相关内容，回复『未在文档中找到相关内容』。
        3) 其他情况（用户在本轮提供了信息、闲聊、工具调用、定义性问题等），
           直接根据用户问题与已有上下文作答 —— 不要加『资料里没有提到 X』之类的免责前言，也不要声明检索状态。
    # 灰度/临时指令位。默认空字符串。例如做 A/B 时填 "本轮请用 markdown 列表组织答案"
    extra: ""
    # 按 provider 部分覆盖。key 是 app.llm.provider 的值；任何字段为 null/缺失就 fallback 到上面的默认。
    # 启动时根据 app.llm.provider 解析成 ResolvedAssistantStyle Bean，运行时不变。
    # 例（全部注释起来，默认所有 provider 共享上面的默认值；按需打开）：
    overrides: {}
    #   anthropic:
    #     tone: "简洁，1–2 句；分组事实时用 <fact>...</fact> XML 标签，Claude 对结构化标签更敏感"
    #   gemini:
    #     # Gemini 触发工具不积极，专门给一句诱导
    #     extra: "如果有可用工具能直接给答案，立刻调用；不要先猜再决定"
    #   ollama:
    #     # Ollama 小模型，要求更明确的指令
    #     tone: "简洁，每句独立成段，避免长复合句；最多 3 句"
    #   deepseek:
    #     # DeepSeek 中文强，可以让风格更口语
    #     tone: "口语化，像跟同事讲技术，必要时用类比；2–3 句话"

  memory:
    # in-memory | redis
    store: in-memory
    # messages | tokens | summary
    # - messages: 按消息数滑窗
    # - tokens: 按 token 数滑窗（OpenAi tokenizer 近似计数）
    # - summary: 超过 max-messages 时把旧消息 LLM 摘要成单条 SystemMessage
    window-mode: messages
    max-messages: 20
    max-tokens: 2000
    tokenizer-model: gpt-4o-mini
    summary:
      # summary 模式下保留多少条最近消息不被压缩
      keep-recent: 6
      # 压缩是否异步（后台 daemon 线程池跑摘要 LLM，不阻塞请求）。false = 同步（请求路径上压缩）
      async: true
      # token 触发预算：>0 时除条数阈值（max-messages）外，估算 token 超此值也触发压缩
      # （治「几条超大消息撑爆上下文但条数没超」）。0 = 关闭，仅按条数。估算复用 tokenizer-model
      max-tokens: 0
      # 摘要膨胀上限（字符）：压出的摘要超此长度截断兜底，防多轮累积压缩越滚越大。0 = 不限
      max-summary-chars: 2000
    redis:
      key-prefix: "chat:mem:"
      ttl: PT24H
    profile:
      # 长期记忆 / 用户画像（跨会话）：正交于上面的会话内滑窗记忆。chat 前召回该用户的 durable 事实
      # （偏好/稳定属性/反复诉求）注入上下文，chat 后异步抽取更新。默认关 → 对话链零变化。
      # 端点 POST /chat/memory、GET/DELETE /memory/profile。详见 docs/long-term-memory.md
      enabled: false
      # in-memory（默认，重启即丢）| redis（持久化升级路径，按信号补）
      store: in-memory
      # 每用户记忆上限，超出淘汰最旧
      max-items: 50
      # chat 前注入时召回最近多少条
      recall-limit: 12
      # 观察（抽取+入库）是否异步，默认 true 不阻塞 chat 响应
      async: true
  eval:
    # /eval/run 第一次被调时是否自动跑一次 /rag/ingest（之后不再重复）。
    # 默认关 —— 不想被 eval 误改向量库。开了能避免「RAG case 召回空 → 假 fail」浪费排查。
    auto-ingest: false

  query-router:
    # 开了之后 /chat/auto 走 classify → 分流到 Assistant(走RAG) 或 BareAssistant(跳过RAG)。
    # 默认关 —— classifier 多 1 次 LLM call，要明确权衡 token 成本才开。
    # 适合：embedding 走云 API（按 token 计费）+ 主对话用大模型 + 大量非 RAG 流量 的生产场景。
    enabled: false

  reflexion:
    # 加权聚合分 < threshold 触发改进；最多 max-attempts 次额外改进（首次生成不计）
    threshold: 0.75
    max-attempts: 2
    # Critic 3 维加权权重。不需要归一化，会用总和当分母。
    # 默认偏重 correctness + completeness（不出错+答全），clarity 次之。
    weights:
      correctness: 0.4
      completeness: 0.4
      clarity: 0.2

  multi-agent:
    replan:
      # Plan-and-Execute 闭环：Synthesizer 出最终答案后跑 Critic 评分，
      # 加权聚合 < threshold → 让 Replanner 看着上一轮 plan/answer/mainIssue 出新 plan，
      # 重跑 DAG。默认关 —— 开启会额外多 1 次 Critic + 可能 1 次 Replanner + 一整轮 worker fan-out。
      enabled: false
      threshold: 0.75
      # 上限 = 多少次"额外"重规划（首次执行不计入）。常见值 1；2 已经接近极限，更多说明 plan 写崩
      max-replans: 1
      # 跟 reflexion 同款 3 维加权，独立配置便于未来分别调整
      weights:
        correctness: 0.4
        completeness: 0.4
        clarity: 0.2
  mcp:
    enabled: false
    # stdio | http
    transport: stdio
    stdio:
      # 例如：npx -y @modelcontextprotocol/server-filesystem /path/to/dir
      command:
        - npx
        - "-y"
        - "@modelcontextprotocol/server-everything"
    http:
      url: http://localhost:3001/mcp
    log-events: true
    # —— MCP Server（反向：把本 app 能力暴露给外部 MCP 客户端 Claude Desktop / Cursor 调入）——
    # 与上面 app.mcp.*（MCP client，把外部 server 工具桥进来）方向相反。默认关。
    # 开启后挂 POST /mcp/server（JSON-RPC 2.0：initialize / tools/list / tools/call），需 X-Api-Key。
    server:
      enabled: false
      server-name: langchain4j-app
      server-version: 1.0.0
      protocol-version: "2024-11-05"
  a2a:
    # A2A（Agent2Agent）Server。默认关 —— 开启后挂 POST /a2a（JSON-RPC）+ GET /.well-known/agent-card.json
    # 三种调用方式：message/send（chat 同步）、message/stream（chat SSE 流式）、
    # message/send + tasks/pushNotificationConfig/set（multi-agent 异步 + webhook 回推）
    enabled: false
    agent-name: LangChain4j Assistant
    agent-description: A LangChain4j + Spring Boot agent exposing chat (sync/streaming) and multi-agent research over the A2A protocol.
    # Agent Card 里对外暴露的 endpoint 前缀（生产填外部可达地址）；card.url = base-url + /a2a
    base-url: http://localhost:8080
    version: 1.0.0
    # message/stream 收口时，若 agent 回复像「澄清式提问」（保守启发式：明确澄清话术+问号结尾+较短），
    # 把终态置为 input-required 而非 completed，给客户端标准的多轮续问语义。噪声大可关。
    detect-input-required: true
    # 异步任务的 push 回推复用 app.async.webhook.*（HMAC secret / timeout / 重试），无需重复配
  rag:
    documents-dir: ./documents
    # 原生多模态（CLIP）embedding：图片直接 embed 进跨模态向量空间，文本 query ↔ 图片互检索。
    # 区别于 app.vision 的 caption→text 路径。默认关。POST /rag/image 入库 + POST /rag/image-search 搜图。
    # 与 chat / 文本 embedding 三向解耦，不注册 EmbeddingModel Bean。详见 docs/multimodal-embedding.md。
    multimodal-embedding:
      enabled: false
      base-url: http://localhost:8000/v1     # OpenAI 兼容 /embeddings：vLLM/TEI 托管 CLIP/jina-clip 或云 jina
      api-key: ${JINA_API_KEY:}              # 本地通常不校验，留空发 EMPTY；云 jina 填真实 key
      model-name: jinaai/jina-clip-v2
      dimension: 1024                        # CLIP 512 / jina-clip-v2 1024；>0 校验返回向量长度，0=不校验
      image-input-format: data-uri           # data-uri | base64
      timeout-seconds: 60
      max-retries: 2
      max-image-bytes: 10485760              # 单图上限 10MB
      top-k: 5
      min-score: 0.0
      log-requests: false
    # 文档元数据注册表（GET /rag/documents 列表/详情/版本从这里读）的存储后端：
    # in-memory（默认）— 进程内存，重启即丢；单实例/本地够用
    # redis — 持久化，重启/多实例后列表仍在，跟持久化向量库配套（见 application-kb.yml）
    registry:
      store: in-memory
    # 召回截断（rerank 关闭时直接作为返回数；rerank 开启时由 reranker 作为最终 top-k）
    top-k: 5
    # 召回侧 cosine 相似度阈值：低于此分的片段不召回。治"召回什么"。
    # 注意：中文 query + nomic-embed-text 下相似度普遍偏低，0.6 之类高阈值会几乎召不回来，
    # eval 把这个钉出来过 —— 默认 0.3 是中文小模型下的折衷。换强 embedding 可调高。
    min-score: 0.3
    chunking:
      # recursive（默认）— 按 unit 硬切 + overlap，简单粗暴，适合任何文档
      # markdown-header — 按 ## section 切，每个 chunk 是完整主题；超长 section fallback 到 recursive
      # parent-child — small-to-big：child 用下面 max-size/overlap 切小块去 embed（召回精准），
      #                parent 用 parent.* 切大块；检索命中 child 后自动换成所属 parent 文本喂模型（上下文完整）
      # semantic — 按主题连续性切：逐句 embed，在相邻句 cosine 距离断崖处下刀（semantic.*）。适合无结构长文，
      #            代价是入库每句多一次 embedding 调用
      strategy: recursive
      # 计量单位 chars（默认）| tokens
      #   chars  — max-size/overlap 按字符数，零依赖；但同样字符数下中英文真实 token 数差 2~3 倍
      #   tokens — 给 splitter 挂 OpenAI tokenizer（tiktoken），max-size/overlap 单位变 token。
      #            LLM context 与计费都按 token 算，更贴生产。本地模型不暴露 tokenizer，用 OpenAI
      #            估算（偏差 ~10-15%，chunk 软目标可接受）。必须保证 max-size+overlap ≤ embedding 模型 max input
      unit: chars
      max-size: 300        # recursive 的目标 chunk 大小；markdown-header 的 section 长度阈值（单位由 unit 决定）
      overlap: 50          # recursive 模式 chunk 重叠（markdown-header 模式只在 fallback 时用到）
      # markdown-header 专用：把连续的、单独不足该阈值的极小 section（如「## 标题」+ 一行）向后合并成
      # 一块，避免碎块单独入库污染检索。单位同 unit（chars 时按字符，tokens 时按 token，tokens 模式建议
      # 调小到 ~30）。0 = 关闭合并。仅对 strategy=markdown-header 生效，recursive 忽略。
      min-section-size: 120
      # tokens 模式下计数用的 tokenizer（OpenAiTokenCountEstimator）；chars 模式忽略
      tokenizer-model: gpt-4o-mini
      # parent-child（small-to-big）专用：仅 strategy=parent-child 时生效。
      #   child = 上面的 max-size/overlap 切的小块（进向量库、决定召回精度）
      #   parent = 下面切的大块（命中 child 后由 TaggedSourceContentInjector 换进 prompt、决定上下文完整度，
      #            多个 child 命中同一 parent 自动去重 → parent 只注入一次）
      # 取舍：parent 全文随 child 冗余存进 metadata（store 体积膨胀），换零新存储 + 重启安全 + 6 种后端一致。
      parent:
        strategy: recursive    # parent 切法：recursive | markdown-header（section 作 parent）
        size: 1200             # parent 目标大小（单位同上面的 unit）
        overlap: 0             # parent 重叠（recursive parent 用；markdown-header 仅 fallback 用）
      # semantic（语义切分）专用：仅 strategy=semantic 时生效。逐句 embed → 算相邻句 cosine 距离 →
      # 距离超过 breakpoint-percentile 分位的间隙即「话题切换」处下刀。代价：入库时每句多一次 embed 调用。
      # embedding 后端故障时自动降级 recursive（不让入库崩）。
      semantic:
        buffer-size: 1               # 每句与前后各 N 句拼成窗口再 embed，平滑单句噪声让边界更稳；0=只用本句
        breakpoint-percentile: 95    # 断点阈值分位：95=约 5% 最大的间隙成为切点（越高切得越少、块越大）
        max-size: 1000               # 语义块大小上限（单位同 unit）；超了用 recursive 再切
        min-size: 0                  # 语义块大小下限（单位同 unit）；不足的碎块向前并块。0=关闭合并

    metrics:
      # 切分质量指标打点（Micrometer，始终在线）：每次入库记录 chunk 尺寸分布 + 碎块/超大块比例，
      # 打到 Prometheus（rag.chunk.size / rag.chunk.total|tiny|oversize / rag.ingest.documents，带 strategy tag）。
      # 换 chunking 策略 / 调 max-size 后切分质量怎么变可观测，不必人肉看召回。阈值按字符数。
      tiny-chars: 50         # 小于此长度的 chunk 计入 rag.chunk.tiny（碎块/孤儿块）
      oversize-chars: 2000   # 大于此长度的 chunk 计入 rag.chunk.oversize（一块塞多主题）

    contextual:
      # Contextual Retrieval（Anthropic）：入库时给每个 chunk 用 temp=0 LLM 生成一句「安放回全文」的
      # 上下文（消解代词/缩写、点明位置），拼到 chunk 前面再 embed —— chunk 脱离全文后仍自洽，召回失败率
      # 显著下降。与 chunking 策略正交（任何 strategy 都可叠加），跟 hybrid(BM25)/rerank 互补叠加效果更好。
      # 代价：每个 chunk 一次 LLM 调用（一次性入库成本）；某 chunk 失败保留原文不前缀（不让入库崩）。
      enabled: false
      max-doc-chars: 8000   # 喂给上下文生成器的文档原文截断上限（控成本/上下文）；单位字符
      min-segments: 2       # 文档切出的 chunk 数 < 该值时跳过（单 chunk 即全文、无指代歧义）

    grounding:
      # RAG 事实幻觉的事后校验（仅作用于触发了检索的回答）。两层叠加：
      #   Layer 0（零 LLM）— 答案里 [doc=ID] 引用的 id 必须在检索集合里，否则判编造引用
      #   Layer 1（faithfulness）— source + 答案喂 temp=0 GroundednessChecker，聚合分 < threshold 视为可能未被支撑
      # 命中后按 on-fail 处置。代价：开启后每条走 RAG 的回答多 1 次 temp=0 LLM 调用。
      enabled: false
      threshold: 0.7
      on-fail: warn                # warn(默认,末尾追加⚠️提示不改写) | refuse(安全话术替换整段) | regenerate(带纠正指令重生成)
      max-regenerations: 1         # regenerate 模式最大重生成次数(首次不计)；仍不过阈降级为 warn。/chat 走真正的纠正重生成

    history-aware:
      # 多轮对话场景：CompressingQueryTransformer 把"它跟 X 啥区别"+ history → "Y 跟 X 啥区别"
      # 再检索。不开则代词类 follow-up 召回会很差。代价是每条 query 多 1 次 LLM call。
      # 跟 query-expansion 互补，两个都开会自动 chain（compress→expand 顺序）。
      enabled: false

    query-expansion:
      # 开了之后每条 query 多 1 次 LLM call 把它扩成 n 个变体（同义改写 / 加上下文 / 拆子问题），
      # 多路并行召回 → DefaultContentAggregator RRF 融合。提升召回，代价是 LLM 成本 + 延迟。
      # 跟 rerank 互补：expansion 提召回，rerank 提精度，两个都开效果叠加。
      enabled: false
      n: 3

    rerank:
      # 关闭则普通向量检索；开启则在 EmbeddingStore 召回 candidate-size 条后再排
      enabled: false
      candidate-size: 20
      # 重排后再卡一道分数门槛。治"重排后留什么"，跟召回侧 min-score 正交。
      # 0.0（默认）= 不丢，保留 reranker 排序后的全部 top-k；
      # 调高（如 0.5）= 重排打分低于阈值的候选直接剔除，避免无关 chunk 占满 top-k。
      min-score: 0.0
      # llm（本地 Ollama 当 reranker，慢但零依赖）| jina（云 API，快+多语言，需 api-key）
      type: llm
      jina:
        api-key: ${JINA_API_KEY:}
        model-name: jina-reranker-v2-base-multilingual
    hybrid:
      # 开启后 vector + 关键词 token-overlap 两路并联检索，DefaultContentAggregator RRF 融合
      enabled: false
      # simple（按字 + 标点切，零依赖）| hanlp（自带词典，中文召回明显更好）
      tokenizer: simple
    graph:
      # GraphRAG：入库时抽「实体-关系」三元组建图，检索时从 query 命中实体做 N 跳遍历，
      # 作为第三路 retriever 并联进 router（vector/keyword/graph），RRF 融合。补向量召回的多跳/关系盲区。
      # 默认关 → 检索链与历史完全一致。需结构化输出能力的模型。详见 docs/graphrag.md
      enabled: false
      # in-memory（默认，零依赖、重启即丢）| jdbc（MySQL 边表持久化，重启不丢，见 jdbc 块）
      store: in-memory
      # 遍历跳数。1 够大多数关系问题；2 召回更全但噪声/成本涨，调前先跑 eval 对照
      max-hops: 1
      # 单次召回三元组上限，挡高连通实体把 context 撑爆
      max-triples: 30
      # token（默认，零 LLM，query 分词匹配实体名）| llm（抽 query 实体再锚定图中实体，更准，每 query 多 1 次 LLM）
      entity-linking: token
      # 建图是否投后台异步（G3）：true 时入库不被 N 次抽取 LLM 调用阻塞，大语料建议开
      async: false
      # 别名规范化表（G4 轻量实体消歧）：表面形式 → canonical。入库时套用，避免同实体裂成多节点
      # aliases:
      #   张三经理: 张三
      #   老张: 张三
      extract:
        # 单 chunk 抽取三元组上限，兜底防模型把每个名词都连成边
        max-triples-per-chunk: 12
        # 受限 schema（G4）：非空时只保留 relation 在白名单内的边，并把允许集喂进抽取 prompt。空 = 开放抽取
        relation-types: []
        #  - 隶属于
        #  - 负责
        #  - 处理
      # store=jdbc 时用（MySQL 边表持久化）
      jdbc:
        url: jdbc:mysql://localhost:3306/graph?useUnicode=true&characterEncoding=utf8
        username: root
        password: ${GRAPH_DB_PASSWORD:}
        table: graph_triple
        create-table: true
    # in-memory | pgvector | milvus | chroma | qdrant | doris
    store: in-memory
    pgvector:
      host: localhost
      port: 5432
      database: postgres
      user: postgres
      password: postgres
      table: document_embeddings
      create-table: true
      use-index: true
      index-list-size: 100
      # VECTOR (默认) | HYBRID — HYBRID 走 PGVector 原生向量+全文 RRF 融合
      search-mode: VECTOR
      text-search-config: simple
      rrf-k: 60
    milvus:
      host: localhost
      port: 19530
      collection: document_embeddings
      # FLAT | IVF_FLAT | HNSW | ...
      index-type: FLAT
      # COSINE | L2 | IP
      metric-type: COSINE
      username:
      password:
    chroma:
      base-url: http://localhost:8000
      collection: document_embeddings
      # 留空则用 chroma v1 API；v2 (chroma >= 0.7) 需要填 tenant / database
      tenant:
      database:
    qdrant:
      host: localhost
      port: 6334
      collection: document_embeddings
      api-key:
      use-tls: false
    doris:
      jdbc-url: jdbc:mysql://localhost:9030/demo
      user: root
      password:
      table: document_embeddings
      # cosine | l2
      metric: cosine
      create-table: true
      buckets: 4

  # NL2SQL / ChatBI（POST /chat/sql）。默认关；开启需 spring-boot-starter-jdbc + mysql-connector-j（已在 pom）。
  # 自然语言 → SQL → 只读执行 → 解读。安全靠 6 层护栏（见 docs/nl2sql.md）：
  #   L1 只读 DB 账号 / L2 单语句+关键字黑名单 / L3 表白名单 / L4 强制 LIMIT / L5 超时 / L6 租户谓词
  # 前置：① 本机 MySQL（默认 localhost:3306），admin（默认 root）有建库/建用户/授权权限；
  #       ② Ollama 起一个支持 tool-calling 的模型（llama3.1 / qwen2.5+ / qwen3），默认 chat 模型见 app.llm.ollama。
  # 本地验证（env var 传参最稳，避免 -Dspring-boot.run.arguments 逗号分隔只生效第一个的坑）：
  #   NL2SQL_DB_PASSWORD=root APP_NL2SQL_ENABLED=true APP_LLM_OLLAMA_MODEL_NAME=qwen3:14b mvn spring-boot:run
  #   curl -X POST localhost:8080/chat/sql -H 'Content-Type: application/json' \
  #        -H 'X-Api-Key: dev-key-tenantA-admin' \
  #        -d '{"question":"退款金额最高的3个客户，列出名字和退款总额"}'
  nl2sql:
    enabled: false
    datasource:
      # admin：建库（createDatabaseIfNotExist）/ 建表 / 种子 / 内省 schema（useInformationSchema 让列注释可读）
      url: "jdbc:mysql://localhost:3306/nl2sql_demo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useInformationSchema=true"
      # 只读池：不带 createDatabaseIfNotExist（只读账号无建库权限）。留空则与 admin 共用 url
      readonly-url: "jdbc:mysql://localhost:3306/nl2sql_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useInformationSchema=true"
      admin-username: root          # 建表 / 种子 / 建只读账号；密码走环境变量
      admin-password: "${NL2SQL_DB_PASSWORD:}"
      readonly-username: nl2sql_ro  # SqlQueryTool 实际执行（只 GRANT SELECT，L1）
      readonly-password: nl2sql_ro
      seed-script: db/nl2sql-demo.sql   # classpath；接真实库时置空（不建 demo 表）
    max-rows: 1000                  # L4：无 LIMIT 时强制追加
    query-timeout-seconds: 5        # L5：statement 超时
    max-tool-calls: 5               # 自修环上限：单次问答 run_sql 最多调几次（含拒/失败重试），防坏 SQL 反复烧 token
    number-grounding: true          # 数字 grounding（确定性、warn 模式）：核对答案数字 ∈ 查询结果，否则末尾追加核对提示
    allow-tables:                   # L3 表白名单（也是 SchemaProvider 暴露范围）
      - orders
      - customers
      - refunds
    tenant-scoped-tables:           # L6：这些表必须带 tenant_id 过滤
      - orders
      - customers
      - refunds
    enforce-tenant-predicate: true  # L6 开关（demo 想省事可关）
    enum-columns:                   # 坑3：把 distinct 值带进 schema，帮模型用对中文枚举
      orders:
        - status

  # 工作流编排（POST /workflow/*）。默认关；开启需一个可用的 MySQL（建 ~25 张 ACT_* 表）。
  # 客服长流程：抽工单 → priority 高则人工审批（UserTask 挂起等人，DB 持久化）→ 通过/驳回 → 生成答复。
  # 详见 docs/workflow-integration.md。本地验证（env var 传参最稳）：
  #   WORKFLOW_DB_PASSWORD=root APP_WORKFLOW_ENABLED=true mvn spring-boot:run
  #   # 发起（任意已认证 key）
  #   curl -X POST localhost:8080/workflow/refund/start -H 'Content-Type: application/json' \
  #        -H 'X-Api-Key: dev-key-tenantA-admin' -d '{"message":"我要退款，订单一直发不了货，急","chatId":"u1"}'
  #   # 审批人查待办 + 完成（需 SCOPE_approve）
  #   curl localhost:8080/workflow/tasks -H 'X-Api-Key: dev-key-tenantA-approver'
  #   curl -X POST localhost:8080/workflow/tasks/{taskId}/complete -H 'Content-Type: application/json' \
  #        -H 'X-Api-Key: dev-key-tenantA-approver' -d '{"approved":true,"comment":"同意退款"}'
  workflow:
    enabled: false
    # 审批超时：UserTask 挂起超过此时长被 ApprovalTimeoutSweeper 自动驳回（防永久挂起，F 节 🔴 一档 #1）。
    # ISO-8601 Duration；本地验证可压成 PT20S。env override：APP_WORKFLOW_APPROVAL_TIMEOUT
    approval-timeout: PT24H
    # 超时扫描间隔（毫秒），默认 60s。env override：APP_WORKFLOW_TIMEOUT_SWEEP_INTERVAL_MS
    timeout-sweep-interval-ms: 60000
    # #3 事务边界 + 补偿：ServiceTask 内 LLM（抽工单 / 生成答复）的最大尝试次数（含首次）。
    # complete() 在同一 Flowable 事务里同步跑 resolve；LLM 抛异常会回滚已记录的人工审批决定。
    # 故重试耗尽后不抛异常，改写降级兜底答复、事务照常提交（用户总能拿到终态回复）。
    llm-max-attempts: 2
    llm-retry-backoff-ms: 500
    # #4 历史表无限增长：已结束且早于保留期的 ACT_HI_* 历史实例 + WF_REPLY 行由 WorkflowHistoryCleaner 定期删。
    # 审计留痕另走 logs/audit.jsonl，Flowable 历史只为流程态查询，可短留。ISO-8601 Duration。
    history-retention: P30D
    history-cleanup-interval-ms: 3600000
    # #8 终态回推可靠投递：start 传了 webhookUrl 才入队。补 WebhookDispatcher 内存重试"进程一挂就丢"的缺口。
    # 签名/超时复用 app.async.webhook.*。投递成功→DELIVERED；4xx 或重试耗尽→DEAD（DLQ，人工捞 WF_OUTBOX 表）。
    outbox:
      poll-interval-ms: 30000   # 重投扫描间隔
      batch-size: 50            # 单轮最多投递条数
      max-attempts: 6           # 含首次，超过进 DEAD
      base-backoff-ms: 5000     # 指数退避基数：第 n 次失败后下次 = now + base*3^(n-1)
    datasource:
      # 默认本机 MySQL，首次启动自动建 flowable 库；密码走环境变量。接已有库时去掉 createDatabaseIfNotExist。
      url: "jdbc:mysql://localhost:3306/flowable?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true"
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: root
      password: "${WORKFLOW_DB_PASSWORD:}"

  # 渠道接入（Milestone 1.B）。默认关。飞书样板：入站意图路由（退款/投诉→工作流，其余→对话）+ 5s ack + 异步回推。
  # 回调端点 POST /channel/feishu/event（SecurityConfig 已放行，用飞书自带验签解密，不带 X-Api-Key）。
  # 凭据来自飞书开放平台开发者后台；走环境变量，yml 留空。详见 docs/workflow-integration.md「渠道（飞书）」。
  channel:
    feishu:
      enabled: false
      app-id: "${FEISHU_APP_ID:}"
      app-secret: "${FEISHU_APP_SECRET:}"
      verification-token: "${FEISHU_VERIFICATION_TOKEN:}"   # 留空=明文模式不校验 token
      encrypt-key: "${FEISHU_ENCRYPT_KEY:}"                 # 留空=事件订阅未开加密（回调明文）
      base-url: https://open.feishu.cn                      # Lark 国际版换 open.larksuite.com
      tenant: tenantA                                       # 飞书应用映射到的内部租户（对齐 seed 的审批人 key）
      approver-chat-id: "${FEISHU_APPROVER_CHAT_ID:}"       # 高风险审批卡片推送目标会话；留空则不推卡片
      http-timeout-ms: 5000

  voice:
    # 语音客服 Agent（turn-based）：音频 → ASR → 客服大脑（意图路由/工作流/RAG 对话）→ TTS → 音频。
    # 默认关 → voice 相关 Bean 全不装配。详见 docs/voice-agent.md。POST /voice/chat（multipart 音频）
    enabled: false
    provider: openai                       # 目前仅 openai 兼容；base-url 可指云 OpenAI / Azure / 本地 whisper+tts 网关
    base-url: https://api.openai.com/v1
    api-key: ${OPENAI_API_KEY:}
    asr-model: whisper-1                   # 或 gpt-4o-transcribe；本地可填 faster-whisper 模型名
    tts-model: tts-1                       # 或 gpt-4o-mini-tts
    tts-voice: alloy
    tts-format: mp3                        # mp3 | wav | opus | aac | flac | pcm（决定回复 content-type）
    language: ""                           # ASR 语言提示（如 zh），留空自动检测
    timeout-seconds: 30
    max-audio-bytes: 26214400              # 上传音频上限 25MB，挡超大文件
    # SSE 半流式 /voice/chat/stream：一句最小字数，低于此不单独切句 TTS（防过短句听感碎、省调用）
    stream-sentence-min-chars: 8

  vision:
    # 多模态文档理解：图片/扫描件 → 视觉模型「描述 + OCR 转写」→ 文本 → 走现有 RAG 全链。
    # 默认关 → vision 相关 Bean 全不装配（VisionConfig / VisionController 条件化）。详见 docs/multimodal.md。
    #   ① 文档入库：POST /rag/documents 上传图片 → 自动转描述/OCR 入库（开关开启时）
    #   ② 视觉对话：POST /chat/vision（multipart image + message）→ 看图直接作答、不入库
    # 跟 app.llm.provider（chat）/ app.embedding.provider（向量化）完全解耦——视觉模型单独选后端。
    enabled: false
    provider: openai-compat                # openai-compat（云 OpenAI/Azure/vLLM）| ollama（本地 llava/qwen2.5-vl）
    base-url: https://api.openai.com/v1
    api-key: ${OPENAI_API_KEY:}
    model-name: gpt-4o-mini                # 需多模态能力：gpt-4o / gpt-4o-mini / qwen2.5-vl / llava / llama3.2-vision
    temperature: 0.2                        # 看图转写偏确定性，压低减少漂移
    timeout-seconds: 60
    max-retries: 3
    max-image-bytes: 10485760              # 单图上限 10MB
    caption-cache-size: 256                # caption 结果按图 SHA-256 去重缓存条数；同图重复上传不重复烧视觉调用。0=关
    log-requests: false
    log-responses: false
    # caption/OCR 指令（入库 + /chat/vision 留空问题时用的默认）。一次调用同时覆盖图像理解与文字转写。
    # 留空走 VisionProperties 内置中文默认；要改语气/语言在这里覆盖即可。
#    caption-prompt: ""

  chaining:
    # Prompt Chaining（Anthropic workflow 模式）：把任务拆成固定顺序的若干步，每步一次 LLM 调用只处理
    # 上一步输出，步间插确定性 gate（不达标短路终止）。预定义代码路径，非模型自主决定流程。默认关。
    # POST /chat/chain body {"input":"..."} → 跑下面 steps 定义的默认链，返回逐步 trace。详见 docs/workflow-patterns.md。
    enabled: false
    steps:                         # 默认链：提纲 → 成文（成文步带 min-length gate 挡空洞输出）
      - name: outline
        instruction: "为下面的主题写一个 3-5 点的中文提纲，每点一行，只输出提纲。"
      - name: draft
        instruction: "严格按这份提纲写一段连贯的中文短文，覆盖每一点。"
        gate-min-length: 80        # 成文过短(<80字)说明没展开 → 短路
#       gate-must-contain: ""      # 可选：输出必须包含的子串
#       gate-must-match: ""        # 可选：输出必须命中的正则(find 语义)

  voting:
    # Voting（Anthropic Parallelization/Voting 模式）：同一问题并行跑 N 次取共识，降低单次随机性、提升可信度
    # （内容审核多重判定 / 分类多数表决）。默认关。POST /chat/vote body {"question":"...","n":5}。详见 docs/workflow-patterns.md。
    enabled: false
    n: 3                           # 并行投票次数
    strategy: majority             # majority(确定性多数表决,离散/分类题) | synthesis(聚合器LLM收口,自由文本题)
    min-agreement: 0.5             # majority 置信阈值：胜出票占比 ≥ 此值才 confident

  deep-agent:
    # 深度 Agent：开放式 plan→act→observe 循环（区别于 multiagent 的固定 DAG）。
    # 默认关 → DeepAgentService / AgentBrain / 示例动作全不装配。详见 docs/deep-agent.md。
    # POST /agent/run body {"goal":"..."} → 返回整条 trace（steps/finalAnswer/stopReason）
    enabled: false
    max-steps: 8                 # 单次 run 步数预算，跑满判 MAX_STEPS 终止，挡 runaway
    max-wall-clock-ms: 0         # 单次 run 墙钟预算(ms)，>0 时超时判 TIMEOUT。0=关。补步数预算：单步偶发慢挡不住耗时跑飞
    max-tokens: 0                # 单次 run 近似 token 预算(字符/4 估算)，>0 时超阈判 BUDGET。0=关。循环内安全上限，正交于全局日配额
    brain-max-retries: 1         # brain 单步决策失败(LLM/解析异常)的额外重试次数，全失败才判 ERROR。补循环最脆一环
    brain-retry-backoff-ms: 0    # 重试前退避(ms)。0=立即重试；退避期间响应线程被取消(interrupt)会提前退出
    max-repeats: 3               # 滑窗内同一(动作,入参)出现达此次数 → 判 LOOP 卡死，提前终止
    loop-window: 6               # 循环检测滑窗步数（能抓 A→B→A→B 震荡；实际窗口取 max(loop-window, max-repeats)）
    max-scratchpad-chars: 4000   # 跨步工作记忆字符上限，超出压缩（按 bullet 行保留最新），防 prompt 膨胀
    scratchpad-summary: false    # scratchpad 溢出时是否 LLM 摘要压缩最旧结论(需 temp=0 判官模型)。false=丢弃最旧整条
    history-window: 6            # 注入 prompt 的最近步数窗口，控每步 prompt 体积
    allow-delegation: true       # 是否允许 delegate 动作（派生子 Agent 跑子目标）
    max-depth: 1                 # delegate 最大递归深度（挡无限自我派生）
    browser:
      # Browser-use：把 Playwright 无头 Chromium 网页自动化做成 AgentAction（browser_open / browser_click）
      # 插进深度 Agent 循环。默认关 → browser 动作与 PlaywrightBrowserSession 全不装配、Chromium 不下载。
      # 开启后首次需装浏览器二进制：mvn exec:java -Dexec.mainClass=com.microsoft.playwright.CLI \
      #   -Dexec.args="install chromium"（或代码 launch() 时自动下载）。详见 docs/deep-agent.md。
      enabled: false
    code-exec:
      # Code Interpreter：模型写 Java 源码 → JShell 沙箱执行 → 回填 stdout/表达式值，做成 AgentAction(code_exec)
      # 插进深度 Agent 循环。默认关。高风险能力：JShell local 引擎与宿主同 JVM，非真隔离，仅尽力而为的
      # 源码 denylist + 墙钟超时 + 输出截断兜底。强隔离需外部受限进程/容器（未来项）。详见 docs/code-exec.md。
      enabled: false
      timeout-ms: 3000          # 单次执行墙钟超时(ms)
      max-output-chars: 2000    # 回传模型的输出上限，超出截断
      max-source-chars: 4000    # 允许提交的源码字符上限，超出拒绝
      block-unsafe-apis: true   # 静态拦截网络/文件/进程/System.exit/反射逃逸等危险 API

  # 语义响应缓存：embed query → 按租户桶找 cosine>=threshold 的历史问答，命中即 0 LLM token 短路。
  # 默认关。零新依赖。/chat 经软依赖接入。详见 docs/semantic-cache.md。
  cache:
    semantic:
      enabled: false
      threshold: 0.95           # cosine 命中阈值 [-1,1]，越高越保守
      max-entries: 1000         # 每租户缓存条数上限，超出 LRU 淘汰
      ttl: 2h                   # 单条存活时长（Duration：30m / 2h / 1d）

  # OpenTelemetry GenAI 分布式追踪：每次 chat 调用一棵 gen_ai.* span 树。默认关。
  # OTLP HTTP exporter（不引 grpc）。补 Micrometer 指标之外的 span 级链路。详见 docs/otel-tracing.md。
  observability:
    otel:
      enabled: false
      endpoint: http://localhost:4318/v1/traces
      service-name: langchain4j-app
      sampler: parentbased_always_on   # parentbased_always_on | always_on | always_off | traceidratio
      sampler-ratio: 1.0
      export-timeout-ms: 30000

management:
  endpoints:
    web:
      exposure:
        # tokenbudget：自定义 endpoint，per-tenant 当日 token 用量快照（运维 dashboard 用）
        include: health,info,metrics,prometheus,tokenbudget
  endpoint:
    health:
      # always 让 K8s probe / 运维直接看到每个 component 详情；actuator 端口通常只对内网开放
      show-details: always
      show-components: always
      # 把 llm / embedding 加进 readiness group，让 K8s readinessProbe 能感知 LLM 后端可达性
      group:
        readiness:
          include: readinessState,llm,embedding
  health:
    # 启用 Spring Boot 的 LivenessState/ReadinessState 健康指标（K8s 部署模式默认开启，
    # 本地启动需要显式打开，不然上面 group.readiness.include 里的 readinessState 找不到）
    probes:
      enabled: true

logging:
  level:
    dev.langchain4j: INFO
    com.lrj: DEBUG
  pattern:
    # ApiKeyAuthFilter 会把 tenantId/userId 灌进 MDC；未挂租户（actuator 等放行路径）显示空
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId:-}] [%X{tenantId:-}/%X{userId:-}] %-5level %logger{36} - %msg%n"
